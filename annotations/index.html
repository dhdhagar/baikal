<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finding Rubric Annotation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="setup" class="setup-overlay" role="dialog" aria-modal="true">
      <form id="setup-form" class="setup-card">
        <div class="brand-mark">B</div>
        <h1>Finding annotation</h1>
        <p>Enter your annotator ID to start or resume your saved session.</p>
        <label for="setup-annotator">Annotator ID</label>
        <input
          id="setup-annotator"
          name="annotator"
          autocomplete="username"
          placeholder="e.g. annotator-1"
          required
        />
        <button id="setup-submit" class="primary" type="submit" disabled>Continue</button>
        <p class="privacy-note">Progress stays in this browser until you export it.</p>
      </form>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark small">B</span>
        <span>Finding annotation</span>
      </div>
      <div class="progress-wrap" aria-label="Annotation progress">
        <div class="progress-label">
          <span id="progress-text">0 of 80 complete</span>
          <span id="save-status" class="save-status">Saved</span>
        </div>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
      <div class="header-actions">
        <button id="change-annotator" class="quiet" type="button">
          <span id="annotator-label">Annotator</span>
        </button>
        <button id="export-csv" class="secondary" type="button">Export CSV</button>
        <button id="export-json" class="quiet icon-button" type="button" title="Export JSON backup">
          JSON
        </button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-heading">
          <span>Items</span>
          <button id="next-incomplete" class="text-button" type="button">Next incomplete</button>
        </div>
        <nav id="item-nav" class="item-nav" aria-label="Annotation items"></nav>
        <div class="legend">
          <span><i class="dot complete"></i>Complete</span>
          <span><i class="dot current"></i>Current</span>
        </div>
      </aside>

      <section id="workspace" class="workspace" aria-live="polite">
        <div id="loading" class="loading">Loading annotation items…</div>
      </section>
    </main>

    <template id="item-template">
      <article class="item-page">
        <div class="item-meta">
          <span id="item-position"></span>
          <span class="meta-separator">·</span>
          <span id="item-dataset"></span>
        </div>

        <section class="content-card question-card">
          <p class="eyebrow">Research question</p>
          <p id="research-question" class="research-question"></p>
          <div class="subquestion">
            <p class="eyebrow">Current sub-question</p>
            <p id="sub-question"></p>
          </div>
        </section>

        <section class="content-card finding-card">
          <p class="eyebrow">Finding to evaluate</p>
          <div id="finding" class="finding-text"></div>
        </section>

        <details id="evidence-details" class="content-card details-card" open>
          <summary>
            <span>Evidence</span>
            <span id="evidence-summary" class="summary-hint"></span>
          </summary>
          <div id="evidence" class="details-content"></div>
        </details>

        <details class="content-card details-card">
          <summary>
            <span>Earlier findings</span>
            <span id="prior-count" class="summary-hint"></span>
          </summary>
          <div id="previous-findings" class="details-content"></div>
        </details>

        <form id="rating-form" class="ratings" autocomplete="off">
          <div id="rubric-fields"></div>
        </form>

        <div class="bottom-nav">
          <button id="previous-item" class="secondary" type="button">← Previous</button>
          <span id="completion-hint">Complete all four ratings to finish this item.</span>
          <button id="next-item" class="primary" type="button">Next →</button>
        </div>
      </article>
    </template>

    <div id="toast" class="toast" role="status"></div>
    <script src="finding_rubric/items_blinded.js"></script>
    <script src="app.js"></script>
  </body>
</html>
